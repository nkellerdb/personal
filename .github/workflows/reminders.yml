name: Workout reminders

on:
  schedule:
    - cron: '*/15 * * * *' # must match WINDOW_MINUTES below
  workflow_dispatch:
    inputs:
      force:
        description: Send a test push now, ignoring the schedule
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    # Does nothing until the secrets are configured (see README → Reminders).
    if: vars.REMINDERS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run send-reminders
        env:
          PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          WINDOW_MINUTES: '15'
          FORCE: ${{ inputs.force && '1' || '0' }}
